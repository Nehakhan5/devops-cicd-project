
name: DevOps CI-CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  S3_BUCKET: devops-cicd-production-251126
  EC2_INSTANCE_ID: i-0d3223e85aa4442f8

jobs:
  test-build-deploy:
    name: Test, Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run automated unit tests
        run: python -m pytest tests -v

      - name: DevSecOps security scanning
        run: python -m bandit app.py

      - name: Build ZIP artifact
        run: |
          mkdir -p dist
          zip -r "dist/build-${GITHUB_SHA}.zip" \
            app.py requirements.txt templates static
          ls -lh dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload build artifact to AWS S3
        run: |
          aws s3 cp "dist/build-${GITHUB_SHA}.zip" \
            "s3://${S3_BUCKET}/builds/build-${GITHUB_SHA}.zip"
          aws s3 cp scripts/deploy.sh \
            "s3://${S3_BUCKET}/scripts/deploy-${GITHUB_SHA}.sh"

      - name: Deploy latest successful build to EC2
        shell: bash
        run: |
          PARAMETERS=$(jq -n \
            --arg bucket "$S3_BUCKET" \
            --arg sha "$GITHUB_SHA" \
            --arg region "$AWS_REGION" \
            '{
              commands: [
                "set -e",
                ("aws s3 cp s3://" + $bucket + "/scripts/deploy-" + $sha + ".sh /tmp/devops-deploy.sh --region " + $region),
                ("bash /tmp/devops-deploy.sh builds/build-" + $sha + ".zip")
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "Deployment command ID: $COMMAND_ID"

          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID"
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID"
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Deployment verification timed out"
          exit 1

      - name: Verify live production application
        run: |
          EXPECTED=$(python -c "from app import VERSION; print(VERSION)")
          ACTUAL=$(curl --fail --retry 10 --retry-delay 3 \
            http://52.62.18.80/health | jq -r .version)

          echo "Expected version: $EXPECTED"
          echo "Production version: $ACTUAL"
          test "$EXPECTED" = "$ACTUAL"
          echo "Production verification successful!"
